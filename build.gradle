plugins {
    id 'java'
    id 'application'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

application {
    mainClass = 'org.example.Main'
}

jar {
    manifest {
        attributes 'Main-Class': 'org.example.Main'
    }
}

dependencies {
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.32.0'
    testImplementation 'org.testng:testng:7.10.2'
}

test {
    useTestNG()
}